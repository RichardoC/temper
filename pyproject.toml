[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "temper-diff"
version = "0.0.1"
description = "Steer an open-weights diffusion LM to generate Rust code, verified by sandboxed proptest runs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "temper contributors" }]
keywords = ["diffusion-lm", "rust", "property-testing", "verification"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
temper = "temper.cli:main"

[tool.setuptools]
packages = ["temper", "temper.harness", "temper.feedback", "temper.model", "temper.steer", "temper.authoring"]
