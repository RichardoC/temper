[task]
name = "sort"
signature = "pub fn sort_i32(v: &mut Vec<i32>)"
doc = "Sorts `v` in ascending order, in place. The multiset of elements must be preserved (duplicates kept). Stable or unstable sorting are both acceptable."
must_define = ["sort_i32"]
prompt_template = """You are writing a Rust module for a crate that will be property-tested. Implement exactly this public API:

```rust
{signature}
```

Specification: {doc}

Rules:
- The code must compile as a standalone `src/candidate.rs` in a crate where ONLY the Rust standard library is available (no external crates, no `mod` declarations, no `fn main`, no tests, no printing).
- API SHAPE: the item in the signature block is a MODULE-LEVEL FREE FUNCTION. Define it as a standalone `pub fn` at module scope. Do NOT put it inside an `impl` block: inherent impl methods do NOT satisfy the signature and will be REJECTED.
- Define EXACTLY the items listed in the signature block — same names, same kinds, nothing else public. Do NOT define any struct (the signature does not declare one). Private helper functions are allowed if you need them.
- Answer with ONE ```rust fenced code block and nothing else.
"""

[properties]
approved = true
